<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Newborn Screening Malaysia - Tender Specs Preparation</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="login-screen" class="login-screen">
  <div class="login-card">
    <h1>Newborn Screening Malaysia</h1>
    <p class="subtitle">Tender Specs Preparation</p>
    <form id="login-form">
      <label for="password">Team password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required />
      <button type="submit">Enter</button>
      <p id="login-error" class="error-text" hidden>Incorrect password.</p>
    </form>
  </div>
</div>

<div id="app-screen" class="app-screen" hidden>
  <header class="app-header">
    <div class="brand">
      <strong>Newborn Screening Malaysia</strong>
      <span>Tender Specs Preparation</span>
    </div>
    <div class="site-controls">
      <select id="site-select"></select>
      <select id="currency-select" title="Currency for this site"></select>
      <button id="new-site-btn" class="btn-secondary">+ New Site</button>
      <button id="rename-site-btn" class="btn-secondary">Rename</button>
      <button id="delete-site-btn" class="btn-danger">Delete</button>
      <span class="version-controls-wrap">
        <button id="save-version-btn" class="btn-secondary">Save Version</button>
        <button id="versions-btn" class="btn-secondary">Versions</button>
        <div id="versions-panel" class="versions-panel" hidden></div>
      </span>
      <span class="export-controls-wrap">
        <button id="export-btn" class="btn-secondary">Export Report</button>
        <div id="export-panel" class="versions-panel export-panel" hidden>
          <button type="button" id="export-excel-btn" class="export-option">Download as Excel (.xlsx)</button>
          <button type="button" id="export-pdf-btn" class="export-option">Download as PDF</button>
        </div>
      </span>
      <span id="save-status" class="save-status"></span>
      <button id="logout-btn" class="btn-secondary">Log out</button>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button data-tab="tenderSpec" class="tab-btn active">Tender Spec Document</button>
    <button data-tab="calculator" class="tab-btn">Calculator</button>
    <button data-tab="supportingInfo" class="tab-btn">Supporting Information</button>
    <button data-tab="discussion" class="tab-btn">Discussion</button>
  </nav>

  <main id="tab-content" class="tab-content"></main>
</div>

<div id="lightbox-overlay" class="lightbox-overlay" hidden>
  <button type="button" id="lightbox-close" class="lightbox-close" aria-label="Close">&times;</button>
  <img id="lightbox-img" src="" alt="" />
</div>

<script src="calc.js"></script>
<script src="app.js"></script>
</body>
</html>
